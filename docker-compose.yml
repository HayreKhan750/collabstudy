version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: collabstudy-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: collabstudy
      POSTGRES_PASSWORD: collabstudy123
      POSTGRES_DB: collabstudy
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U collabstudy']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - collabstudy-network

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: collabstudy-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --requirepass collabstudy123
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - collabstudy-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  collabstudy-network:
    driver: bridge
