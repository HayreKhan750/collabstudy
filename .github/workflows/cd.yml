# =============================================================================
# CollabStudy — Continuous Deployment
# =============================================================================
# Triggers: push to main OR published GitHub release tag (v*).
# Jobs:
#   1. build-and-push-api  — Docker multi-stage build → GHCR (api image)
#   2. build-and-push-web  — Docker multi-stage build → GHCR (web image)
#
# Images are tagged with both the short commit SHA and 'latest'.
# Build context is always the REPO ROOT so pnpm workspace files are accessible.
#
# Required secrets (set in repo Settings → Secrets → Actions):
#   GITHUB_TOKEN  — automatically provided by Actions (GHCR auth)
#
# Optional deploy secrets (add your own deployment step below):
#   DEPLOY_SSH_KEY, DEPLOY_HOST, etc.
# =============================================================================

name: CD

on:
  push:
    branches: [main]
  release:
    types: [published]

# Only one deploy at a time — prevent race conditions
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  REGISTRY: ghcr.io
  # Image names derive from the repo owner/name automatically
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/collabstudy-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/collabstudy-web

jobs:
  # ── Job 1: Build & Push API Image ────────────────────────────────────────
  build-and-push-api:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Required to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # BuildKit enables layer caching and multi-stage build optimizations
          driver-opts: |
            network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            # Tag with short commit SHA on every push
            type=sha,prefix=,suffix=,format=short
            # Tag 'latest' on main branch pushes
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Tag with semver on release (e.g. v1.2.3 → 1.2.3, 1.2, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v6
        with:
          # ⚠ Context must be repo root — pnpm workspace files live here
          context: .
          file: apps/api/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          # Inline layer cache — pulls from GHCR, stores back after build
          cache-from: type=registry,ref=${{ env.API_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.API_IMAGE }}:buildcache,mode=max
          # Build args
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            GIT_SHA=${{ github.sha }}

  # ── Job 2: Build & Push Web Image ────────────────────────────────────────
  build-and-push-web:
    name: Build & Push Web Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Web Docker image
        uses: docker/build-push-action@v6
        with:
          # ⚠ Context must be repo root — pnpm workspace files live here
          context: .
          file: apps/web/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=registry,ref=${{ env.WEB_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.WEB_IMAGE }}:buildcache,mode=max
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            GIT_SHA=${{ github.sha }}
            NEXT_TELEMETRY_DISABLED=1

  # ── Job 3: Post-Deploy Summary ────────────────────────────────────────────
  # Runs after both images are pushed. Extend this job with your actual
  # deployment step (SSH, kubectl, Coolify webhook, Railway deploy, etc.)
  deploy-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build-and-push-api, build-and-push-web]
    permissions:
      contents: read

    steps:
      - name: Print image summary
        run: |
          echo "## 🚀 CollabStudy Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| API   | \`ghcr.io/${{ github.repository_owner }}/collabstudy-api:$(echo ${{ github.sha }} | cut -c1-7)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Web   | \`ghcr.io/${{ github.repository_owner }}/collabstudy-web:$(echo ${{ github.sha }} | cut -c1-7)\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pushed to GHCR at $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      # ── Railway Deploy ──────────────────────────────────────────────────
      # Triggers a redeploy on Railway for both api and web services.
      # Required secrets (set in GitHub repo Settings → Secrets → Actions):
      #   RAILWAY_API_SERVICE_ID  — from Railway dashboard → api service → Settings → Service ID
      #   RAILWAY_WEB_SERVICE_ID  — from Railway dashboard → web service → Settings → Service ID
      #   RAILWAY_TOKEN           — from Railway dashboard → Account Settings → Tokens
      - name: Redeploy API on Railway
        if: ${{ secrets.RAILWAY_TOKEN != '' }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"serviceId":"${{ secrets.RAILWAY_API_SERVICE_ID }}","environmentId":"production"}' \
            https://backboard.railway.app/graphql/v2 \
            --data-raw '{"query":"mutation { serviceInstanceRedeploy(serviceId: \"${{ secrets.RAILWAY_API_SERVICE_ID }}\") }"}' || true

      - name: Redeploy Web on Railway
        if: ${{ secrets.RAILWAY_TOKEN != '' }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-raw '{"query":"mutation { serviceInstanceRedeploy(serviceId: \"${{ secrets.RAILWAY_WEB_SERVICE_ID }}\") }"}' \
            https://backboard.railway.app/graphql/v2 || true

      # ── Alternative: use the official Railway CLI ───────────────────────
      # Uncomment below and remove the curl steps above if you prefer the CLI:
      #
      # - name: Install Railway CLI
      #   run: npm install -g @railway/cli
      #
      # - name: Deploy API to Railway
      #   run: railway redeploy --service ${{ secrets.RAILWAY_API_SERVICE_ID }} --yes
      #   env:
      #     RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      #
      # - name: Deploy Web to Railway
      #   run: railway redeploy --service ${{ secrets.RAILWAY_WEB_SERVICE_ID }} --yes
      #   env:
      #     RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
