# =============================================================================
# CollabStudy — Production Docker Compose
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   - Create a .env.prod file at the repo root (copy apps/api/.env.example)
#   - Set ALL required variables (DATABASE_URL, REDIS_HOST, JWT_SECRET, etc.)
#   - Run DB migrations after first boot:
#       docker compose -f docker-compose.prod.yml exec api \
#         npx prisma migrate deploy --schema=/app/packages/db/prisma/schema.prisma
# =============================================================================

name: collabstudy-prod

services:

  # ── PostgreSQL (with pgvector) ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: collabstudy-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collabstudy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-collabstudy}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collabstudy}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - collabstudy-prod-network
    # Do NOT expose 5432 to the host in production — internal only
    expose:
      - "5432"

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: collabstudy-prod-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - collabstudy-prod-network
    expose:
      - "6379"

  # ── NestJS API ────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    image: collabstudy/api:latest
    container_name: collabstudy-prod-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-collabstudy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-collabstudy}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Auth
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # AI
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required in production}
      # S3 (optional — omit to use local disk fallback)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      # CORS — must match deployed frontend URL
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required in production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      # Persist local uploads when S3 is not configured
      - api_uploads:/app/apps/api/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - collabstudy-prod-network

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    image: collabstudy/web:latest
    container_name: collabstudy-prod-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Next.js needs the API URL at runtime for server-side requests
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:4000}
      # Socket.io endpoint (accessible from the browser — use public URL)
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:4000}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - collabstudy-prod-network

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  api_uploads:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  collabstudy-prod-network:
    driver: bridge
